{% extends "base.html" %}

{% block title %}تسجيل الدخول — SafeVision{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card login-card fade-in">
        <div class="login-inner">
            <div class="login-icon">🦺</div>
            <h1>مرحباً بك</h1>
            <p class="login-subtitle">سجل الدخول إلى SafeVision</p>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="email">
                        <i class="bi bi-envelope-fill"></i> البريد الإلكتروني
                    </label>
                    <input type="email" id="email" name="email" placeholder="user@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="bi bi-lock-fill"></i> كلمة المرور
                    </label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">
                    <i class="bi bi-box-arrow-in-right"></i> تسجيل الدخول
                </button>
            </form>
        </div>
        
        <div class="login-footer">
            <p>ليس لديك حساب؟ <a href="{{ url_for('register') }}">سجل الآن</a></p>
        </div>
    </div>
</div>

<style>
    .login-wrapper {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
}

.login-card {
    width: 100%;
    padding: 2.5rem;
}
    
    .login-inner {
        background: rgba(15, 23, 42, 0.5);
        border-radius: 16px;
        padding: 3rem 2rem;
        width: 100%;
        box-sizing: border-box;
    }
    
    .login-icon {
        font-size: 3.5rem;
        margin-bottom: 0.8rem;
        text-align: center;
        filter: drop-shadow(0 0 20px rgba(0, 217, 192, 0.5));
    }
    
    .login-card h1 {
        font-size: 2rem;
        font-weight: 900;
        background: linear-gradient(135deg, #ffffff 0%, #00d9c0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.3rem;
        text-align: center;
    }
    
    .login-subtitle {
        color: #94a3b8;
        font-size: 0.95rem;
        margin-bottom: 2rem;
        text-align: center;
    }
    
    .form-group {
        margin-bottom: 1.2rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 700;
        color: #f0f4f8;
        font-size: 0.9rem;
    }
    
    .form-group label i {
        color: #00d9c0;
        margin-left: 5px;
    }
    
    .form-group input {
        width: 100%;
        padding: 0.9rem 1rem;
        background: rgba(15, 23, 42, 0.6);
        border: 2px solid rgba(0, 217, 192, 0.2);
        border-radius: 12px;
        color: #f0f4f8;
        font-size: 0.95rem;
        font-family: 'Cairo', sans-serif;
        transition: all 0.3s ease;
        direction: rtl;
        box-sizing: border-box;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #00d9c0;
        box-shadow: 0 0 0 4px rgba(0, 217, 192, 0.15);
    }
    
    .form-group input::placeholder {
        color: #64748b;
    }
    
    .btn-full {
        width: 100%;
        padding: 1rem;
        font-size: 1.05rem;
        margin-top: 0.5rem;
    }
    
    .login-footer {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(0, 217, 192, 0.15);
    }
    
    .login-footer p {
        color: #94a3b8;
        font-size: 0.9rem;
    }
    
    .login-footer a {
        color: #00d9c0;
        text-decoration: none;
        font-weight: 700;
        transition: all 0.3s;
    }
    
    .login-footer a:hover {
        text-shadow: 0 0 10px rgba(0, 217, 192, 0.5);
    }

    @media (max-width: 768px) {
        .login-card { padding: 1.5rem; }
        .login-inner { padding: 2rem 1.5rem; }
        .login-card h1 { font-size: 1.6rem; }
    }
</style>
{% endblock %}
